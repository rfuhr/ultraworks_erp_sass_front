<div class="otp-container" role="group" [attr.aria-label]="'Código de ' + length() + ' dígitos'">
  @for (_ of digits(); track $index; let i = $index) {
    <input
      #otpInputs
      [value]="digits()[i]"
      (input)="onInput($event, i)"
      (keydown)="onKeydown($event, i)"
      (focus)="onFocus(i)"
      (paste)="onPaste($event)"
      [disabled]="disabled()"
      maxlength="1"
      class="otp-field"
      [class.otp-field-filled]="digits()[i] !== ''"
      [class.otp-field-error]="hasError()"
      [attr.aria-label]="'Dígito ' + (i + 1) + ' de ' + length()"
      type="text"
      [attr.inputmode]="type() === 'number' ? 'numeric' : 'text'"
      autocomplete="one-time-code"
    />
  }
</div>
@if (errorMessage()) {
  <div class="otp-error">{{ errorMessage() }}</div>
}
