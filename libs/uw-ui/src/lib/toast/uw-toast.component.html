<div cdkOverlayOrigin #toastOrigin="cdkOverlayOrigin" class="uw-toast__origin"></div>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="toastOrigin"
  [cdkConnectedOverlayOpen]="true"
  [cdkConnectedOverlayPositions]="overlayPositions"
>
  <div class="uw-toast__container" role="status" aria-live="polite">
    @for (toast of service.toasts(); track toast.id) {
      <div class="uw-toast uw-toast--{{ toast.type }}" role="alert">
        <span class="material-symbols-outlined uw-toast__icon">{{ icons[toast.type] }}</span>
        <span class="uw-toast__message">{{ toast.message }}</span>
        <button class="uw-toast__close" (click)="service.remove(toast.id)" type="button">✕</button>
        <div class="uw-toast__progress" [style.animation-duration]="toast.duration + 'ms'"></div>
      </div>
    }
  </div>
</ng-template>
