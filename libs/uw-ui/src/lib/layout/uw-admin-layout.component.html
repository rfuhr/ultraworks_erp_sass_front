<div class="uw-layout" [class.uw-layout--collapsed]="collapsed()">
  <uw-sidebar
    class="uw-layout__sidebar"
    [class.uw-layout__sidebar--mobile-open]="mobileOpen()"
    [items]="menuItems()"
    [bottomItems]="bottomItems()"
    [user]="user()"
    [collapsed]="collapsed()"
    [title]="sidebarTitle()"
    (navigate)="navigate.emit($event)"
    (toggle)="toggleSidebar()"
    (logout)="logout.emit()"
  />

  @if (mobileOpen()) {
    <button
      type="button"
      class="uw-layout__overlay"
      aria-label="Fechar menu"
      (click)="closeMobile()"
    ></button>
  }

  <div class="uw-layout__main">
    <uw-header
      [title]="title()"
      [user]="user()"
      [unreadCount]="unreadCount()"
      [notifications]="notifications()"
      [notificationsLoading]="notificationsLoading()"
      [notificationsError]="notificationsError()"
      [notificationLabels]="notificationLabels()"
      [profileItems]="profileItems()"
      (toggleSidebar)="toggleSidebar()"
      (notificationsClick)="notificationsClick.emit()"
      (notificationItemClick)="notificationItemClick.emit($event)"
      (notificationsRetry)="notificationsRetry.emit()"
      (notificationsShowAll)="notificationsShowAll.emit()"
      (profileItemClick)="profileItemClick.emit($event)"
      (profileClick)="closeMobile()"
    />

    <uw-subheader [items]="breadcrumb()" />

    <main class="uw-layout__content">
      <ng-content />
    </main>
  </div>
</div>
