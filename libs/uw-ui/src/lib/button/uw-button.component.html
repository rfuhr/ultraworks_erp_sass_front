<button
  [type]="type()"
  [disabled]="disabled()"
  (click)="clicked.emit($event)"
   [class.w-full]="fullWidth()"
   class="relative inline-flex items-center justify-center transition-all duration-150 rounded-xl cursor-pointer
          disabled:opacity-50 disabled:cursor-not-allowed"
  [class]="classes()"
  [style]="styles()"
>
  @if (icon() && (iconPosition() === 'left' || iconOnly())) {
    <span
      class="material-symbols-outlined leading-none select-none"
      [style.font-size]="iconSize()"
      [class.mr-2]="!iconOnly() && !!label()"
    >{{ icon() }}</span>
  }

  @if (!iconOnly() && label()) {
    <span>{{ label() }}</span>
  }

  @if (icon() && iconPosition() === 'right' && !iconOnly()) {
    <span
      class="material-symbols-outlined leading-none select-none"
      [style.font-size]="iconSize()"
      [class.ml-2]="!!label()"
    >{{ icon() }}</span>
  }

  @if (badge() !== null && badge() !== undefined) {
    <span class="absolute -top-1.5 -right-1.5">
      <uw-badge
        [label]="badge()"
        [variant]="badgeVariant()"
        [badgeSize]="badgeSize()"
        [dot]="badgeDot()"
      />
    </span>
  }
</button>
