  [style.background]="bg()"
  [style.color]="color()"
  [style.border]="border()"
  [style.font-size]="fontSize()"
  [style.min-width]="dimension()"
  [style.height]="dimension()"
  [style.padding]="padding()"
>{{ dot() ? '' : label() }}</span>
